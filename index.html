<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow-Up">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Follow-Up</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07090f;--s1:#0c1017;--s2:#111827;--s3:#162032;
  --border:#1a2740;--border2:#223050;
  --cyan:#06b6d4;--purple:#8b5cf6;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;
  --text:#e8f0fe;--dim:#94a3b8;--muted:#3d5470;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);}
.nb{flex:1;padding:10px 4px 12px;text-align:center;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;transition:color 0.2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nb .ic{font-size:20px;}
.nb.on{color:var(--cyan);}

.hdr{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.hdr h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr p{font-size:11px;color:var(--muted);}

.view{display:none;padding:0 14px;}
.view.on{display:block;}

.card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title::before{content:'';width:3px;height:12px;background:linear-gradient(var(--cyan),var(--purple));border-radius:2px;}

.drop-zone{border:2px dashed var(--border2);border-radius:14px;padding:28px 16px;text-align:center;cursor:pointer;background:var(--s2);margin-bottom:12px;}
.drop-zone:active{border-color:var(--cyan);}
#csv-input{display:none;}

.or-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.or-line{flex:1;height:1px;background:var(--border);}
.or-txt{font-size:11px;color:var(--muted);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;}
.field input,.field select,.field textarea{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);}
select option{background:var(--s1);}
.lang-row{display:flex;gap:8px;}
.lang-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-align:center;font-family:'Inter',sans-serif;}
.lang-btn.on{border-color:var(--cyan);background:#06b6d412;color:var(--cyan);}

.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-p{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff;}
.btn-g{background:var(--s2);color:var(--dim);border:1px solid var(--border);margin-top:8px;font-size:13px;padding:11px;}

.cl-item{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.cl-av{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;}
.cl-info{flex:1;min-width:0;}
.cl-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.prog{height:2px;background:var(--border);border-radius:99px;margin-top:7px;overflow:hidden;}
.prog-f{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:99px;}

.pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:0.4px;border:1px solid;}
.p-sent{background:#10b98112;color:var(--green);border-color:#10b98130;}
.p-sch{background:#06b6d412;color:var(--cyan);border-color:#06b6d430;}

.profile-hero{background:linear-gradient(135deg,#0c1c35,#111827);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;}
.p-av-lg{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:12px;}
.p-meta{font-size:11px;color:var(--cyan);margin-top:3px;font-weight:500;}
.p-actions{display:flex;gap:8px;margin-top:14px;}
.p-btn{flex:1;padding:9px;border-radius:10px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.info-box{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px;}
.info-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
.info-val{font-size:12px;font-weight:500;color:var(--text);word-break:break-all;}
.info-box.full{grid-column:1/-1;}

.sms-item{background:var(--s2);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:8px;}
.sms-item.done{border-color:#10b98125;}
.sms-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.sms-lbl{font-size:11px;font-weight:700;color:var(--dim);}
.sms-date{font-size:10px;color:var(--cyan);margin-top:2px;}
.sms-body{font-size:12px;line-height:1.6;color:var(--text);background:var(--s3);border-radius:10px 10px 4px 10px;padding:10px 12px;white-space:pre-wrap;}

.phone-wrap{display:flex;justify-content:center;margin:10px 0 14px;}
.phone{width:210px;background:#0a0a0a;border-radius:34px;border:3px solid #1a1a1a;padding:16px 10px 20px;box-shadow:0 20px 50px #00000090;}
.ph-bar{width:46px;height:4px;background:#1a1a1a;border-radius:99px;margin:0 auto 12px;}
.ph-screen{background:#000;border-radius:20px;padding:12px 10px;min-height:140px;}
.ph-name{text-align:center;font-size:9px;color:#444;font-weight:700;letter-spacing:1px;margin-bottom:10px;}
.ph-bubble{background:#1d4ed8;border-radius:13px 13px 4px 13px;padding:9px 11px;font-size:11px;color:#fff;line-height:1.5;max-width:96%;margin-left:auto;white-space:pre-wrap;}
.ph-ts{text-align:right;font-size:8px;color:#333;margin-top:3px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat-box{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;}
.stat-n{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.stat-l{font-size:10px;color:var(--muted);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.4px;}

.up-item{padding:10px 0;border-bottom:1px solid var(--border);}
.up-item:last-child{border:none;}

.empty{text-align:center;padding:48px 16px;color:var(--muted);}
.empty-ico{font-size:38px;margin-bottom:10px;}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--s2);border:1px solid var(--border2);color:var(--text);padding:9px 18px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;transition:all 0.25s;z-index:300;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Follow-Up</h1>
    <p>Leo Aquino · Reacao Inc</p>
  </div>
</div>

<div id="v-clients" class="view on">
  <div id="cl-list"></div>
  <div id="cl-detail" style="display:none;"></div>
</div>

<div id="v-import" class="view">
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-input').click()">
    <div style="font-size:32px;margin-bottom:8px;">📂</div>
    <div style="font-size:14px;font-weight:600;">Import from Meridian</div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Tap to upload CSV from Ownerville</div>
    <input type="file" id="csv-input" accept=".csv,.txt">
  </div>

  <button class="btn" onclick="clearAll()" style="background:#ef444415;color:var(--red);border:1px solid #ef444430;margin-bottom:12px;font-size:13px;padding:11px;">Clear all clients</button>

  <div class="or-row"><div class="or-line"></div><div class="or-txt">or add manually</div><div class="or-line"></div></div>

  <div class="card">
    <div class="card-title">Add Client</div>
    <div class="field"><label>Full Name</label><input id="f-name" type="text" placeholder="Maria Garcia"></div>
    <div class="field"><label>Phone</label><input id="f-phone" type="tel" placeholder="(562) 555-0000"></div>
    <div class="field"><label>Email</label><input id="f-email" type="email" placeholder="maria@email.com"></div>
    <div class="field"><label>Delivery Address</label><input id="f-addr" type="text" placeholder="1234 Main St, Long Beach CA"></div>
    <div class="field"><label>Correct Address</label><input id="f-correct-addr" type="text" placeholder="1238 Main St or Unit 3B"></div>
    <div class="field"><label>Sales Date</label><input id="f-date" type="date"></div>
    <div class="field"><label>Notes</label><textarea id="f-notes" rows="2" placeholder="Ex: Jorge - casal latinos..."></textarea></div>
    <div class="field">
      <label>Language (auto-detected by surname)</label>
      <div class="lang-row">
        <button class="lang-btn on" data-l="en" onclick="setLang('en')">US English</button>
        <button class="lang-btn" data-l="es" onclick="setLang('es')">MX Espanol</button>
      </div>
    </div>
    <button class="btn btn-p" onclick="addManual()">Add Client</button>
  </div>
</div>

<div id="v-stats" class="view">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-n" id="st-c">0</div><div class="stat-l">Clients</div></div>
    <div class="stat-box"><div class="stat-n" id="st-s">0</div><div class="stat-l">Copied</div></div>
    <div class="stat-box"><div class="stat-n" id="st-p">0</div><div class="stat-l">Pending</div></div>
    <div class="stat-box"><div class="stat-n" id="st-t">0</div><div class="stat-l">Today</div></div>
  </div>
  <div class="card">
    <div class="card-title">Upcoming</div>
    <div id="upcoming"></div>
  </div>
</div>

<nav class="nav">
  <button class="nb on" onclick="goTab('clients')" id="nb-clients"><span class="ic">👥</span>Clients</button>
  <button class="nb" onclick="goTab('import')" id="nb-import"><span class="ic">⬆️</span>Import</button>
  <button class="nb" onclick="goTab('stats')" id="nb-stats"><span class="ic">📊</span>Stats</button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────
const GRADIENTS = [
  'linear-gradient(135deg,#06b6d4,#3b82f6)',
  'linear-gradient(135deg,#8b5cf6,#ec4899)',
  'linear-gradient(135deg,#10b981,#06b6d4)',
  'linear-gradient(135deg,#f59e0b,#ef4444)',
  'linear-gradient(135deg,#3b82f6,#8b5cf6)',
];

const SPANISH = ['garcia','hernandez','gonzalez','gonzales','martinez','lopez','rodriguez','perez','sanchez','ramirez','torres','flores','rivera','gomez','diaz','reyes','morales','jimenez','castillo','ruiz','vargas','medina','aguilar','guzman','munoz','mendoza','chavez','alvarez','ramos','romero','herrera','ortiz','cruz','gutierrez','delgado','lara','vega','campos','espinoza','contreras','pena','treto','quintanilla','caliwag'];

let clients = JSON.parse(localStorage.getItem('fu_clients') || '[]');
let selLang = 'en';

function save() { localStorage.setItem('fu_clients', JSON.stringify(clients)); }
function today() { return new Date().toISOString().split('T')[0]; }
function grad(i) { return GRADIENTS[i % GRADIENTS.length]; }

// ── DATE HELPERS ─────────────────────────────────────────────
function addDays(dateStr, days) {
  var d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d;
}
function fmtDate(d) {
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function fmtFull(d) { return fmtDate(d) + ' · 1:00 PM'; }

// ── LANGUAGE ─────────────────────────────────────────────────
function detectLang(name) {
  var parts = name.toLowerCase().split(' ');
  for (var i = 0; i < parts.length; i++) {
    if (SPANISH.indexOf(parts[i]) >= 0) return 'es';
  }
  return 'en';
}

function setLang(l) {
  selLang = l;
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('on', b.dataset.l === l);
  });
}

// ── MESSAGES ─────────────────────────────────────────────────
function buildMsgs(client) {
  var notesRaw = client.notes ? client.notes.trim() : '';
  var notesFirst = notesRaw.split(/[\s\-,]/)[0];
  var useNotes = notesFirst.length >= 2 && notesFirst.length <= 20 && /^[A-Za-záéíóúÁÉÍÓÚñÑüÜ]+$/.test(notesFirst);
  var first = useNotes ? notesFirst : client.name.split(' ')[0];
  var isFem = /a$/i.test(first);
  var amigo = isFem ? 'mi amiga' : 'mi amigo';
  var lang = client.lang || detectLang(client.name);
  var email = client.email || '(email)';

  var T = {
    es: [
      'Buenas tardes ' + first + ', Leo por aqui, solo para recordarte que tu aparato de Spectrum debe llegar manana. Cuando llegue te contacto para hacer la activacion de tu servicio.',
      'Perfecto ' + first + ', ahora ya esta todo listo. Descargue la aplicacion de My Spectrum e inicie sesion.\n\nUsername: ' + email + '\nContrasena: @Wifi2026!\n\nCualquier duda me avisa. Leo',
      'Hola ' + first + ' ' + amigo + ', como va el internet? Ya una semana con Spectrum espero que estes disfrutando la velocidad. Cualquier cosa me llamas. Leo'
    ],
    en: [
      'Good afternoon ' + first + ', Leo here, just a reminder that your Spectrum device should arrive tomorrow. Once it is there I will reach out to get your service activated.',
      'Perfect ' + first + ', everything is all set now. Download the My Spectrum app and log in.\n\nUsername: ' + email + '\nPassword: @Wifi2026!\n\nLet me know if you need anything. Leo',
      'Hey ' + first + ', how is the internet? One week with Spectrum already, hope you are loving the speed. Hit me up anytime. Leo'
    ]
  };

  var Lbl = {
    es: ['Aviso Dia 1', 'Activacion (Dia 2)', 'Check-in 1 semana'],
    en: ['Day 1 notice', 'Activation (Day 2)', '1 week check-in']
  };

  var offsets = [1, 2, 7];
  var keys = ['notice', 'activation', 'week'];

  return keys.map(function(key, i) {
    var d = addDays(client.saleDate, offsets[i]);
    return {
      key: key,
      label: Lbl[lang][i],
      label_es: Lbl.es[i],
      label_en: Lbl.en[i],
      dayOffset: offsets[i],
      text: T[lang][i],
      text_es: T.es[i],
      text_en: T.en[i],
      activeLang: lang,
      status: 'future',
      date: d.toISOString().split('T')[0],
      dateDisplay: fmtDate(d),
      timeDisplay: key === 'activation' ? fmtDate(d) + ' · Call client' : fmtFull(d)
    };
  });
}

function ensureBilingual(c) {
  if (!c.msgs || !c.msgs.length) { c.msgs = buildMsgs(c); return; }
  if (c.msgs[0].text_es && c.msgs[0].text_en) return;
  var fresh = buildMsgs(c);
  c.msgs.forEach(function(m, i) {
    if (!m.text_es) m.text_es = fresh[i] ? fresh[i].text_es : m.text;
    if (!m.text_en) m.text_en = fresh[i] ? fresh[i].text_en : m.text;
    if (!m.label_es) m.label_es = fresh[i] ? fresh[i].label_es : m.label;
    if (!m.label_en) m.label_en = fresh[i] ? fresh[i].label_en : m.label;
    if (!m.activeLang) m.activeLang = c.lang || detectLang(c.name);
  });
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
function scheduleNotifs(client) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var first = client.name.split(' ')[0];
  var notifs = JSON.parse(localStorage.getItem('fu_notifs') || '[]');
  var schedule = [
    { day: 1, msg: 'Send SMS to ' + first + ' — Day 1 notice', clientId: client.id },
    { day: 2, msg: 'Call ' + first + ' — kit should have arrived', clientId: client.id },
    { day: 7, msg: 'Send SMS to ' + first + ' — 1 week check-in', clientId: client.id }
  ];
  schedule.forEach(function(s) {
    var d = addDays(client.saleDate, s.day);
    d.setHours(13, 0, 0, 0);
    notifs.push({ time: d.getTime(), msg: s.msg, clientId: s.clientId, day: s.day });
  });
  localStorage.setItem('fu_notifs', JSON.stringify(notifs));
}

function removeNotifs(clientId) {
  var notifs = JSON.parse(localStorage.getItem('fu_notifs') || '[]');
  localStorage.setItem('fu_notifs', JSON.stringify(notifs.filter(function(n) { return n.clientId !== clientId; })));
}

function checkNotifs() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var now = Date.now();
  var notifs = JSON.parse(localStorage.getItem('fu_notifs') || '[]');
  var keep = [];
  notifs.forEach(function(n) {
    if (n.time <= now && n.time >= now - 3600000) {
      new Notification('Follow-Up · Spectrum', { body: n.msg, tag: n.clientId + '-' + n.day });
    } else if (n.time > now) {
      keep.push(n);
    }
  });
  localStorage.setItem('fu_notifs', JSON.stringify(keep));
}

function requestNotifPerm() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// ── CSV IMPORT ─────────────────────────────────────────────────
document.getElementById('csv-input').addEventListener('change', function(e) { handleFile(e.target.files[0]); });
document.getElementById('drop-zone').addEventListener('dragover', function(e) { e.preventDefault(); });
document.getElementById('drop-zone').addEventListener('drop', function(e) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

function parseCSVLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function parseDate(str) {
  if (!str) return today();
  var d = new Date(str);
  return isNaN(d.getTime()) ? today() : d.toISOString().split('T')[0];
}

function handleFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var lines = e.target.result.split('\n').filter(function(l) { return l.trim(); });
    if (lines.length < 2) { showToast('CSV too short'); return; }

    var headers = parseCSVLine(lines[0]).map(function(h) { return h.trim().replace(/^["']|["']$/g, '').trim().toLowerCase(); });
    function col(name) { return headers.indexOf(name); }

    var iName   = col('name');
    var iPhone  = col('phone');
    var iEmail  = col('email');
    var iAddr   = col('address');
    var iDate   = col('sales date');
    var iNotes  = col('notes');
    var iID     = col('id');
    var iStatus = col('status');

    var added = 0, updated = 0;

    for (var i = 1; i < lines.length; i++) {
      var cols = parseCSVLine(lines[i]);
      var name = iName >= 0 ? (cols[iName] || '').trim() : '';
      if (!name) continue;

      var saleId = iID >= 0 ? (cols[iID] || '').trim() : '';
      var existIdx = saleId ? clients.findIndex(function(c) { return c.saleId === saleId; }) : -1;

      var rawStatus = iStatus >= 0 ? (cols[iStatus] || '') : '';
      var sm = rawStatus.match(/(Paid|Installed|Pending|Cancelled)/gi);
      var status = sm ? sm[sm.length - 1] : 'Pending';

      if (existIdx >= 0) { clients[existIdx].status = status; updated++; continue; }

      var rawNotes = iNotes >= 0 ? (cols[iNotes] || '').trim() : '';
      var numMatch = rawNotes.match(/^(#?\d+\w*|apt\.?\s*\w+|unit\s*\w+)/i);
      var correctAddr = numMatch ? numMatch[0].trim() : '';

      var client = {
        id: Date.now() + i,
        saleId: saleId,
        name: name,
        phone: iPhone >= 0 ? (cols[iPhone] || '').trim() : '',
        email: iEmail >= 0 ? (cols[iEmail] || '').trim() : '',
        address: iAddr >= 0 ? (cols[iAddr] || '').trim() : '',
        correctAddr: correctAddr,
        saleDate: parseDate(iDate >= 0 ? (cols[iDate] || '').trim() : ''),
        notes: rawNotes,
        lang: detectLang(name),
        msgs: [],
        status: status
      };
      client.msgs = buildMsgs(client);
      clients.push(client);
      scheduleNotifs(client);
      added++;
    }

    save();
    renderList();
    var msg = [];
    if (added > 0) msg.push(added + ' new');
    if (updated > 0) msg.push(updated + ' updated');
    showToast(msg.length ? msg.join(' · ') : 'Import done');
    goTab('clients');
  };
  reader.readAsText(file);
}

// ── MANUAL ADD ─────────────────────────────────────────────────
document.getElementById('f-date').value = today();

function addManual() {
  var name  = document.getElementById('f-name').value.trim();
  var phone = document.getElementById('f-phone').value.trim();
  var email = document.getElementById('f-email').value.trim();
  var addr  = document.getElementById('f-addr').value.trim();
  var caddr = document.getElementById('f-correct-addr').value.trim();
  var date  = document.getElementById('f-date').value;
  var notes = document.getElementById('f-notes').value.trim();
  if (!name || !phone || !date) { showToast('Name, phone and date required'); return; }

  var client = {
    id: Date.now(), name: name, phone: phone, email: email,
    address: addr, correctAddr: caddr, saleDate: date,
    notes: notes, lang: selLang, msgs: [], status: 'Pending'
  };
  client.msgs = buildMsgs(client);
  clients.push(client);
  save();
  scheduleNotifs(client);
  renderList();
  showToast('Client added!');
  ['f-name','f-phone','f-email','f-addr','f-correct-addr','f-notes'].forEach(function(id) {
    document.getElementById(id).value = '';
  });
  document.getElementById('f-date').value = today();
  goTab('clients');
}

// ── CLIENT LIST ─────────────────────────────────────────────────
function renderList() {
  var el = document.getElementById('cl-list');
  if (!clients.length) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">📱</div><p>No clients yet</p></div>';
    return;
  }
  var sorted = clients.slice().sort(function(a, b) { return b.saleDate.localeCompare(a.saleDate); });
  el.innerHTML = sorted.map(function(c, i) {
    var sent  = c.msgs.filter(function(m) { return m.status === 'sent'; }).length;
    var total = c.msgs.length || 3;
    var pct   = Math.round((sent / total) * 100);
    var next  = c.msgs.find(function(m) { return m.status !== 'sent'; });
    var lang  = c.msgs[0] ? c.msgs[0].activeLang : c.lang;
    var flag  = lang === 'es' ? 'MX' : 'US';
    var sub   = next ? flag + ' · Next: ' + next.label + ' · ' + next.dateDisplay : 'All done';
    return '<div class="cl-item" onclick="openClient(' + c.id + ')">' +
      '<div class="cl-av" style="background:' + grad(i) + '">' + c.name[0].toUpperCase() + '</div>' +
      '<div class="cl-info">' +
        '<div class="cl-name">' + c.name + '</div>' +
        '<div class="cl-sub">' + sub + '</div>' +
        '<div class="prog"><div class="prog-f" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div style="color:var(--muted);font-size:18px;">›</div>' +
      '</div>';
  }).join('');
}

// ── CLIENT DETAIL ─────────────────────────────────────────────
function openClient(id) {
  var c = clients.find(function(x) { return x.id === id; });
  var idx = clients.indexOf(c);
  document.getElementById('cl-list').style.display = 'none';
  var det = document.getElementById('cl-detail');
  det.style.display = 'block';

  ensureBilingual(c);
  var activeLang = c.msgs[0] ? c.msgs[0].activeLang : detectLang(c.name);
  var detected = detectLang(c.name);
  var next = c.msgs.find(function(m) { return m.status !== 'sent'; });
  var sent = c.msgs.filter(function(m) { return m.status === 'sent'; }).length;
  var phoneFormatted = c.phone ? c.phone.replace(/\D/g, '').replace(/^(\d{10})$/, '+1$1') : '';

  det.innerHTML =
    '<div class="profile-hero">' +
      '<div class="p-av-lg" style="background:' + grad(idx) + '" id="av-' + id + '">' + c.name[0].toUpperCase() + '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<div id="pname-d-' + id + '" style="font-size:20px;font-weight:800;cursor:pointer;" onclick="editName(' + id + ')">' + c.name + ' ✏️</div>' +
        '<input id="pname-i-' + id + '" type="text" value="' + c.name + '" style="display:none;width:100%;background:var(--s3);border:1px solid var(--cyan);color:var(--text);border-radius:8px;padding:6px 10px;font-size:16px;font-weight:700;font-family:Inter,sans-serif;outline:none;" onblur="saveName(' + id + ')" onkeydown="if(event.key===\'Enter\')saveName(' + id + ')">' +
      '</div>' +
      '<div class="p-meta">Sale: ' + fmtDate(addDays(c.saleDate, 0)) + ' · ' + sent + '/' + c.msgs.length + ' done</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px;align-items:center;">' +
        '<span style="font-size:10px;color:var(--muted);font-weight:600;">LANG:</span>' +
        '<button id="btn-es-' + id + '" onclick="switchLang(' + id + ',\'es\')" style="padding:5px 12px;border-radius:8px;border:1px solid ' + (activeLang==='es'?'var(--cyan)':'var(--border)') + ';background:' + (activeLang==='es'?'#06b6d415':'var(--s2)') + ';color:' + (activeLang==='es'?'var(--cyan)':'var(--muted)') + ';font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">MX ES</button>' +
        '<button id="btn-en-' + id + '" onclick="switchLang(' + id + ',\'en\')" style="padding:5px 12px;border-radius:8px;border:1px solid ' + (activeLang==='en'?'var(--cyan)':'var(--border)') + ';background:' + (activeLang==='en'?'#06b6d415':'var(--s2)') + ';color:' + (activeLang==='en'?'var(--cyan)':'var(--muted)') + ';font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">US EN</button>' +
        '<span style="font-size:9px;color:var(--muted);background:var(--s3);padding:2px 6px;border-radius:99px;">' + detected + ' auto</span>' +
      '</div>' +
      '<div class="p-actions">' +
        '<button class="p-btn" style="background:#10b98115;color:var(--green);border:1px solid #10b98130;" onclick="markSent(' + id + ')">' + (next ? 'Mark sent' : 'All done') + '</button>' +
        '<button class="p-btn" style="background:#06b6d415;color:var(--cyan);border:1px solid #06b6d430;" onclick="resetMsgs(' + id + ')">Reset</button>' +
        (phoneFormatted ? '<a href="tel:' + phoneFormatted + '" class="p-btn" style="background:#8b5cf615;color:#a78bfa;border:1px solid #8b5cf630;text-decoration:none;display:flex;align-items:center;justify-content:center;">Call</a>' : '') +
      '</div>' +
      '<button onclick="completeRemove(' + id + ')" style="width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px solid #10b98140;background:#10b98112;color:var(--green);font-size:13px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Complete & Remove client</button>' +
    '</div>' +

    '<div class="info-grid">' +
      '<div class="info-box"><div class="info-label">Phone</div>' +
        '<div id="phone-d-' + id + '" class="info-val" style="cursor:pointer;" onclick="editPhone(' + id + ')">' + (c.phone || '—') + ' ✏️</div>' +
        '<input id="phone-i-' + id + '" type="tel" value="' + (c.phone || '') + '" style="display:none;width:100%;background:var(--s3);border:1px solid var(--cyan);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px;font-family:Inter,sans-serif;outline:none;margin-top:4px;" onblur="savePhone(' + id + ')" onkeydown="if(event.key===\'Enter\')savePhone(' + id + ')">' +
      '</div>' +
      '<div class="info-box"><div class="info-label">Sale Date</div><div class="info-val">' + fmtDate(addDays(c.saleDate, 0)) + '</div></div>' +
      '<div class="info-box full"><div class="info-label">Email</div><div class="info-val">' + (c.email || '—') + '</div></div>' +
      '<div class="info-box full"><div class="info-label">Delivery Address</div><div class="info-val">' + (c.address || '—') + '</div></div>' +
      (c.correctAddr ? '<div class="info-box full"><div class="info-label">Correct Address</div><div class="info-val" style="color:var(--cyan);font-weight:600;">' + c.correctAddr + '</div></div>' : '') +
      (c.notes ? '<div class="info-box full"><div class="info-label">Notes</div><div class="info-val" style="color:var(--yellow);">' + c.notes + '</div></div>' : '') +
    '</div>' +

    '<div class="phone-wrap">' +
      '<div class="phone"><div class="ph-bar"></div>' +
        '<div class="ph-screen">' +
          '<div class="ph-name">SPECTRUM (LEO)</div>' +
          '<div class="ph-bubble" id="pb-text">' + ((next || c.msgs[c.msgs.length - 1]) ? (next || c.msgs[c.msgs.length - 1]).text : '...') + '</div>' +
          '<div class="ph-ts" id="pb-ts">' + ((next || c.msgs[c.msgs.length - 1]) ? (next || c.msgs[c.msgs.length - 1]).timeDisplay : '') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card-title">Message Sequence</div>' +
    '<div id="tl-' + id + '"></div>' +
    '<button class="btn btn-g" onclick="backToList()">Back</button>';

  renderTimeline(c);
}

function renderTimeline(c) {
  var el = document.getElementById('tl-' + c.id);
  if (!el) return;
  el.innerHTML = c.msgs.map(function(m, i) {
    var pillCls = m.status === 'sent' ? 'p-sent' : 'p-sch';
    var pillTxt = m.status === 'sent' ? 'Copied' : 'Pending';
    var done = m.status === 'sent' ? ' done' : '';
    return '<div class="sms-item' + done + '" id="sms-' + c.id + '-' + i + '">' +
      '<div class="sms-hdr" onclick="previewSMS(' + c.id + ',' + i + ')">' +
        '<div><div class="sms-lbl">' + m.label + '</div><div class="sms-date">' + m.timeDisplay + '</div></div>' +
        '<div style="display:flex;gap:6px;align-items:center;">' +
          '<div class="pill ' + pillCls + '">' + pillTxt + '</div>' +
          '<button onclick="event.stopPropagation();copyMsg(' + c.id + ',' + i + ')" style="background:#10b98115;border:1px solid #10b98130;color:var(--green);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Copy</button>' +
          '<button onclick="event.stopPropagation();toggleEdit(' + c.id + ',' + i + ')" style="background:#06b6d415;border:1px solid #06b6d430;color:var(--cyan);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Edit</button>' +
        '</div>' +
      '</div>' +
      '<div id="sv-' + c.id + '-' + i + '" class="sms-body">' + m.text + '</div>' +
      '<div id="se-' + c.id + '-' + i + '" style="display:none;margin-top:8px;">' +
        '<textarea id="sta-' + c.id + '-' + i + '" rows="4" oninput="updateCount(' + c.id + ',' + i + ')" style="width:100%;background:var(--s3);border:1px solid var(--cyan);color:var(--text);border-radius:10px;padding:10px;font-size:12px;font-family:Inter,sans-serif;outline:none;resize:none;line-height:1.6;">' + m.text + '</textarea>' +
        '<div style="text-align:right;font-size:10px;margin-top:3px;"><span id="sc-' + c.id + '-' + i + '" style="color:var(--muted)">' + m.text.length + '</span>/160</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px;">' +
          '<button onclick="saveEdit(' + c.id + ',' + i + ')" style="flex:1;background:#10b98120;border:1px solid #10b98140;color:var(--green);border-radius:8px;padding:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Save</button>' +
          '<button onclick="toggleEdit(' + c.id + ',' + i + ')" style="flex:1;background:var(--s2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Cancel</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function copyMsg(cId, idx) {
  var c = clients.find(function(x) { return x.id === cId; });
  var m = c.msgs[idx];
  navigator.clipboard.writeText(m.text).then(function() {
    m.status = 'sent';
    save();
    renderTimeline(c);
    updateStats();
    showToast('Copied! Paste in Messages app');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = m.text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    m.status = 'sent';
    save();
    renderTimeline(c);
    updateStats();
    showToast('Copied!');
  });
}

function previewSMS(cId, idx) {
  var c = clients.find(function(x) { return x.id === cId; });
  var m = c.msgs[idx];
  var pb = document.getElementById('pb-text');
  var ts = document.getElementById('pb-ts');
  if (pb) pb.textContent = m.text;
  if (ts) ts.textContent = m.timeDisplay;
}

function toggleEdit(cId, idx) {
  var v = document.getElementById('sv-' + cId + '-' + idx);
  var e = document.getElementById('se-' + cId + '-' + idx);
  var editing = e.style.display !== 'none';
  v.style.display = editing ? 'block' : 'none';
  e.style.display = editing ? 'none' : 'block';
  if (!editing) document.getElementById('sta-' + cId + '-' + idx).focus();
}

function updateCount(cId, idx) {
  var ta = document.getElementById('sta-' + cId + '-' + idx);
  var n = document.getElementById('sc-' + cId + '-' + idx);
  if (!ta || !n) return;
  var len = ta.value.length;
  n.textContent = len;
  n.style.color = len > 160 ? 'var(--red)' : len > 140 ? 'var(--yellow)' : 'var(--muted)';
}

function saveEdit(cId, idx) {
  var c = clients.find(function(x) { return x.id === cId; });
  var t = document.getElementById('sta-' + cId + '-' + idx).value.trim();
  if (!t) return;
  var m = c.msgs[idx];
  m.text = t;
  if (m.activeLang === 'es') m.text_es = t; else m.text_en = t;
  save();
  document.getElementById('sv-' + cId + '-' + idx).textContent = t;
  toggleEdit(cId, idx);
  var pb = document.getElementById('pb-text');
  if (pb) pb.textContent = t;
  showToast('Saved!');
}

function switchLang(id, lang) {
  var c = clients.find(function(x) { return x.id === id; });
  ensureBilingual(c);
  c.msgs.forEach(function(m) {
    m.activeLang = lang;
    m.text  = lang === 'es' ? m.text_es  : m.text_en;
    m.label = lang === 'es' ? m.label_es : m.label_en;
  });
  c.lang = lang;
  save();
  renderTimeline(c);
  var next = c.msgs.find(function(m) { return m.status !== 'sent'; }) || c.msgs[c.msgs.length - 1];
  var pb = document.getElementById('pb-text');
  var ts = document.getElementById('pb-ts');
  if (pb) pb.textContent = next.text;
  if (ts) ts.textContent = next.timeDisplay;
  ['es', 'en'].forEach(function(l) {
    var btn = document.getElementById('btn-' + l + '-' + id);
    if (!btn) return;
    var active = l === lang;
    btn.style.borderColor = active ? 'var(--cyan)' : 'var(--border)';
    btn.style.background  = active ? '#06b6d415'   : 'var(--s2)';
    btn.style.color       = active ? 'var(--cyan)'  : 'var(--muted)';
  });
  showToast(lang === 'es' ? 'Espanol' : 'English');
}

function markSent(id) {
  var c = clients.find(function(x) { return x.id === id; });
  var next = c.msgs.find(function(m) { return m.status !== 'sent'; });
  if (!next) { showToast('All done!'); return; }
  next.status = 'sent';
  save();
  openClient(id);
  updateStats();
  showToast('Marked as done!');
}

function resetMsgs(id) {
  var c = clients.find(function(x) { return x.id === id; });
  c.msgs = buildMsgs(c);
  save();
  openClient(id);
  showToast('Reset!');
}

function completeRemove(id) {
  if (!confirm('Remove this client?')) return;
  removeNotifs(id);
  clients = clients.filter(function(x) { return x.id !== id; });
  save();
  backToList();
  updateStats();
  showToast('Client removed!');
}

function editName(id) {
  document.getElementById('pname-d-' + id).style.display = 'none';
  var inp = document.getElementById('pname-i-' + id);
  inp.style.display = 'block'; inp.focus(); inp.select();
}

function saveName(id) {
  var inp = document.getElementById('pname-i-' + id);
  var n = inp.value.trim();
  if (!n) { inp.focus(); return; }
  var c = clients.find(function(x) { return x.id === id; });
  c.name = n; save();
  var av = document.getElementById('av-' + id);
  if (av) av.textContent = n[0].toUpperCase();
  inp.style.display = 'none';
  var d = document.getElementById('pname-d-' + id);
  d.textContent = n + ' ✏️'; d.style.display = 'block';
  renderList(); showToast('Name updated!');
}

function editPhone(id) {
  document.getElementById('phone-d-' + id).style.display = 'none';
  var inp = document.getElementById('phone-i-' + id);
  inp.style.display = 'block'; inp.focus(); inp.select();
}

function savePhone(id) {
  var inp = document.getElementById('phone-i-' + id);
  var n = inp.value.trim();
  var c = clients.find(function(x) { return x.id === id; });
  c.phone = n; save();
  openClient(id);
  showToast('Phone updated!');
}

function backToList() {
  document.getElementById('cl-list').style.display = 'block';
  document.getElementById('cl-detail').style.display = 'none';
  renderList();
}

function clearAll() {
  if (!confirm('Clear ALL clients?')) return;
  clients = []; save(); renderList(); showToast('Cleared'); goTab('clients');
}

// ── STATS ─────────────────────────────────────────────────────
function updateStats() {
  var sent = 0, pending = 0, todayCount = 0;
  var todayStr = today();
  var upcoming = [];
  clients.forEach(function(c) {
    c.msgs.forEach(function(m) {
      if (m.status === 'sent') sent++;
      else {
        pending++;
        if (m.date === todayStr) todayCount++;
        upcoming.push({ name: c.name, label: m.label, timeDisplay: m.timeDisplay, text: m.text, date: m.date });
      }
    });
  });
  document.getElementById('st-c').textContent = clients.length;
  document.getElementById('st-s').textContent = sent;
  document.getElementById('st-p').textContent = pending;
  document.getElementById('st-t').textContent = todayCount;

  var ul = document.getElementById('upcoming');
  if (!upcoming.length) { ul.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:8px 0;">No scheduled messages</div>'; return; }
  upcoming.sort(function(a, b) { return a.date.localeCompare(b.date); });
  ul.innerHTML = upcoming.slice(0, 6).map(function(u) {
    return '<div class="up-item">' +
      '<div style="font-size:12px;font-weight:600;">' + u.name + ' <span style="color:var(--muted);font-weight:400;">· ' + u.label + '</span></div>' +
      '<div style="font-size:10px;color:var(--cyan);margin-top:2px;">' + u.timeDisplay + '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:3px;">' + u.text.substring(0, 80) + '...</div>' +
    '</div>';
  }).join('');
}

// ── TABS ─────────────────────────────────────────────────────
function goTab(tab) {
  ['clients', 'import', 'stats'].forEach(function(t) {
    document.getElementById('v-' + t).classList.toggle('on', t === tab);
    document.getElementById('nb-' + t).classList.toggle('on', t === tab);
  });
  if (tab === 'clients') backToList();
  if (tab === 'stats') updateStats();
}

// ── TOAST ─────────────────────────────────────────────────────
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2600);
}

// ── INIT ─────────────────────────────────────────────────────
clients.forEach(function(c) {
  var detected = detectLang(c.name);
  if (c.lang !== detected) {
    c.lang = detected;
    if (c.msgs && c.msgs.length) {
      c.msgs.forEach(function(m) {
        m.activeLang = detected;
        m.text  = detected === 'es' ? (m.text_es || m.text) : (m.text_en || m.text);
        m.label = detected === 'es' ? (m.label_es || m.label) : (m.label_en || m.label);
      });
    }
  }
  ensureBilingual(c);
});
save();
renderList();
updateStats();
requestNotifPerm();
checkNotifs();
setInterval(checkNotifs, 30 * 60 * 1000);
</script>
</body>
