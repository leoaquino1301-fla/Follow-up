<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow-Up">
<meta name="theme-color" content="#07090f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Follow-Up</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#07090f;--s1:#0c1017;--s2:#111827;--s3:#162032;
  --border:#1a2740;--border2:#223050;
  --cyan:#06b6d4;--purple:#8b5cf6;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;
  --text:#e8f0fe;--dim:#94a3b8;--muted:#3d5470;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;}

.nav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px);}
.nb{flex:1;padding:10px 4px 12px;text-align:center;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;transition:color 0.2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nb .ic{font-size:20px;}
.nb.on{color:var(--cyan);}

.hdr{padding:16px 16px 8px;}
.hdr h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr p{font-size:11px;color:var(--muted);}

.view{display:none;padding:0 14px;}
.view.on{display:block;}

.card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.card-title::before{content:'';width:3px;height:12px;background:linear-gradient(var(--cyan),var(--purple));border-radius:2px;}

.drop-zone{border:2px dashed var(--border2);border-radius:14px;padding:32px 16px;text-align:center;cursor:pointer;background:var(--s2);margin-bottom:12px;}
.drop-zone:active{border-color:var(--cyan);}
#csv-input{display:none;}

.search-bar{display:flex;align-items:center;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;gap:8px;}
.search-bar input{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.search-bar input::placeholder{color:var(--muted);}

.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-g{background:var(--s2);color:var(--dim);border:1px solid var(--border);margin-top:8px;font-size:13px;padding:11px;}

.cl-item{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.cl-av{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;flex-shrink:0;}
.cl-info{flex:1;min-width:0;}
.cl-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-plan{font-size:10px;color:var(--cyan);margin-top:2px;font-weight:500;}

.pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:0.4px;border:1px solid;}
.p-sent{background:#10b98112;color:var(--green);border-color:#10b98130;}
.p-sch{background:#06b6d412;color:var(--cyan);border-color:#06b6d430;}

.profile-hero{background:linear-gradient(135deg,#0c1c35,#111827);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;}
.p-av-lg{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:12px;}
.p-meta{font-size:11px;color:var(--cyan);margin-top:3px;font-weight:500;}
.p-plan{font-size:12px;color:var(--yellow);margin-top:4px;font-weight:600;}
.p-actions{display:flex;gap:8px;margin-top:14px;}
.p-btn{flex:1;padding:9px;border-radius:10px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.info-box{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:12px;}
.info-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
.info-val{font-size:12px;font-weight:500;color:var(--text);word-break:break-all;}
.info-box.full{grid-column:1/-1;}

.sms-item{background:var(--s2);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:8px;}
.sms-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.sms-lbl{font-size:11px;font-weight:700;color:var(--dim);}
.sms-date{font-size:10px;color:var(--cyan);margin-top:2px;}
.sms-body{font-size:12px;line-height:1.6;color:var(--text);background:var(--s3);border-radius:10px 10px 4px 10px;padding:10px 12px;white-space:pre-wrap;}

.phone-wrap{display:flex;justify-content:center;margin:10px 0 14px;}
.phone{width:210px;background:#0a0a0a;border-radius:34px;border:3px solid #1a1a1a;padding:16px 10px 20px;box-shadow:0 20px 50px #00000090;}
.ph-bar{width:46px;height:4px;background:#1a1a1a;border-radius:99px;margin:0 auto 12px;}
.ph-screen{background:#000;border-radius:20px;padding:12px 10px;min-height:140px;}
.ph-name{text-align:center;font-size:9px;color:#444;font-weight:700;letter-spacing:1px;margin-bottom:10px;}
.ph-bubble{background:#1d4ed8;border-radius:13px 13px 4px 13px;padding:9px 11px;font-size:11px;color:#fff;line-height:1.5;max-width:96%;margin-left:auto;white-space:pre-wrap;}
.ph-ts{text-align:right;font-size:8px;color:#333;margin-top:3px;}

/* STATS */
.stats-hero{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.stats-total{font-size:42px;font-weight:800;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.stats-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.stats-box{border-radius:12px;padding:12px;text-align:center;}
.stats-box-installed{background:#10b98115;border:1px solid #10b98130;}
.stats-box-pending{background:#f59e0b15;border:1px solid #f59e0b30;}
.stats-box-cancelled{background:#ef444415;border:1px solid #ef444430;}
.stats-n{font-size:26px;font-weight:800;line-height:1;}
.stats-n-green{color:var(--green);}
.stats-n-yellow{color:var(--yellow);}
.stats-n-red{color:var(--red);}
.stats-sub{font-size:9px;font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:0.5px;}
.stats-pct{font-size:11px;font-weight:600;margin-top:4px;}

.up-item{padding:10px 0;border-bottom:1px solid var(--border);}
.up-item:last-child{border:none;}

.empty{text-align:center;padding:48px 16px;color:var(--muted);}
.empty-ico{font-size:38px;margin-bottom:10px;}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--s2);border:1px solid var(--border2);color:var(--text);padding:9px 18px;border-radius:99px;font-size:12px;font-weight:600;opacity:0;transition:all 0.25s;z-index:300;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="hdr">
  <h1>Follow-Up</h1>
  <p>Leo Aquino · Reacao Inc</p>
</div>

<!-- CLIENTS -->
<div id="v-clients" class="view on">
  <div class="search-bar">
    <span style="color:var(--muted);font-size:16px;">🔍</span>
    <input id="search-input" type="text" placeholder="Search client..." oninput="renderList()">
  </div>
  <div id="cl-list"></div>
  <div id="cl-detail" style="display:none;"></div>
</div>

<!-- IMPORT -->
<div id="v-import" class="view">
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-input').click()">
    <div style="font-size:40px;margin-bottom:10px;">📂</div>
    <div style="font-size:15px;font-weight:700;">Import from Meridian</div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;">Tap to upload CSV from Ownerville<br>Duplicates are detected automatically</div>
    <input type="file" id="csv-input" accept=".csv,.txt">
  </div>
  <button class="btn" onclick="clearAll()" style="background:#ef444415;color:var(--red);border:1px solid #ef444430;font-size:13px;padding:11px;">🗑️ Clear all clients</button>
</div>

<!-- STATS -->
<div id="v-stats" class="view">
  <!-- TOTALS -->
  <div class="stats-hero">
    <div class="stats-total" id="st-total">0</div>
    <div class="stats-label">Total clients imported</div>
    <div class="stats-grid">
      <div class="stats-box stats-box-installed">
        <div class="stats-n stats-n-green" id="st-installed">0</div>
        <div class="stats-sub" style="color:var(--green);">Installed</div>
        <div class="stats-pct" id="st-installed-pct" style="color:var(--green);">0%</div>
      </div>
      <div class="stats-box stats-box-pending">
        <div class="stats-n stats-n-yellow" id="st-pending">0</div>
        <div class="stats-sub" style="color:var(--yellow);">Pending</div>
        <div class="stats-pct" id="st-pending-pct" style="color:var(--yellow);">0%</div>
      </div>
      <div class="stats-box stats-box-cancelled">
        <div class="stats-n stats-n-red" id="st-cancelled">0</div>
        <div class="stats-sub" style="color:var(--red);">Cancelled</div>
        <div class="stats-pct" id="st-cancelled-pct" style="color:var(--red);">0%</div>
      </div>
    </div>
  </div>

  <!-- WEEKLY REPORT -->
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <button onclick="shiftWeek(-1)" style="background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 14px;font-size:16px;cursor:pointer;">←</button>
      <div id="week-label" style="font-size:12px;font-weight:700;color:var(--cyan);text-align:center;"></div>
      <button onclick="shiftWeek(1)" style="background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 14px;font-size:16px;cursor:pointer;">→</button>
    </div>
    <div id="week-report"></div>
  </div>
</div>

<nav class="nav">
  <button class="nb on" onclick="goTab('clients')" id="nb-clients"><span class="ic">👥</span>Clients</button>
  <button class="nb" onclick="goTab('import')" id="nb-import"><span class="ic">⬆️</span>Import</button>
  <button class="nb" onclick="goTab('stats')" id="nb-stats"><span class="ic">📊</span>Stats</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const GRADIENTS = [
  'linear-gradient(135deg,#06b6d4,#3b82f6)',
  'linear-gradient(135deg,#8b5cf6,#ec4899)',
  'linear-gradient(135deg,#10b981,#06b6d4)',
  'linear-gradient(135deg,#f59e0b,#ef4444)',
  'linear-gradient(135deg,#3b82f6,#8b5cf6)',
];

const SPANISH = ['garcia','hernandez','gonzalez','gonzales','martinez','lopez','rodriguez','perez','sanchez','ramirez','torres','flores','rivera','gomez','diaz','reyes','morales','jimenez','castillo','ruiz','vargas','medina','aguilar','guzman','munoz','mendoza','chavez','alvarez','ramos','romero','herrera','ortiz','cruz','gutierrez','delgado','lara','vega','campos','espinoza','contreras','pena','treto','quintanilla','caliwag','rolon','lara','bazan'];

let clients = JSON.parse(localStorage.getItem('fu_clients') || '[]');

function save() { localStorage.setItem('fu_clients', JSON.stringify(clients)); }
function today() { return new Date().toISOString().split('T')[0]; }
function grad(i) { return GRADIENTS[i % GRADIENTS.length]; }

function addDays(dateStr, days) {
  var d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d;
}
function fmtDate(d) { return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function fmtFull(d) { return fmtDate(d) + ' · 1:00 PM'; }

function detectLang(name) {
  var parts = name.toLowerCase().split(' ');
  for (var i = 0; i < parts.length; i++) {
    if (SPANISH.indexOf(parts[i]) >= 0) return 'es';
  }
  return 'en';
}

function buildMsgs(client) {
  var notesRaw = client.notes ? client.notes.trim() : '';
  var notesFirst = notesRaw.split(/[\s\-,]/)[0];
  var useNotes = notesFirst.length >= 2 && notesFirst.length <= 20 && /^[A-Za-záéíóúÁÉÍÓÚñÑüÜ]+$/.test(notesFirst);
  var first = useNotes ? notesFirst : client.name.split(' ')[0];
  var isFem = /a$/i.test(first);
  var amigo = isFem ? 'mi amiga' : 'mi amigo';
  var lang = client.lang || detectLang(client.name);
  var email = client.email || '(email)';

  var T = {
    es: [
      'Buenas tardes ' + first + ', Leo por aqui, solo para recordarte que tu aparato de Spectrum debe llegar manana. Cuando llegue te contacto para hacer la activacion de tu servicio.',
      'Perfecto ' + first + ', ahora ya esta todo listo. Descargue la aplicacion de My Spectrum e inicie sesion.\n\nUsername: ' + email + '\nContrasena: @Wifi2026!\n\nCualquier duda me avisa. Leo',
      'Hola ' + first + ' ' + amigo + ', como va el internet? Ya una semana con Spectrum espero que estes disfrutando la velocidad. Cualquier cosa me llamas. Leo'
    ],
    en: [
      'Good afternoon ' + first + ', Leo here, just a reminder that your Spectrum device should arrive tomorrow. Once it is there I will reach out to get your service activated.',
      'Perfect ' + first + ', everything is all set now. Download the My Spectrum app and log in.\n\nUsername: ' + email + '\nPassword: @Wifi2026!\n\nLet me know if you need anything. Leo',
      'Hey ' + first + ', how is the internet? One week with Spectrum already, hope you are loving the speed. Hit me up anytime. Leo'
    ]
  };

  var Lbl = {
    es: ['Aviso Dia 1', 'Activacion (Dia 2)', 'Check-in 1 semana'],
    en: ['Day 1 notice', 'Activation (Day 2)', '1 week check-in']
  };

  var offsets = [1, 2, 7];
  var keys = ['notice', 'activation', 'week'];

  return keys.map(function(key, i) {
    var d = addDays(client.saleDate, offsets[i]);
    return {
      key: key,
      label: Lbl[lang][i], label_es: Lbl.es[i], label_en: Lbl.en[i],
      dayOffset: offsets[i],
      text: T[lang][i], text_es: T.es[i], text_en: T.en[i],
      activeLang: lang,
      date: d.toISOString().split('T')[0],
      dateDisplay: fmtDate(d),
      timeDisplay: key === 'activation' ? fmtDate(d) + ' · Call client' : fmtFull(d)
    };
  });
}

function ensureBilingual(c) {
  if (!c.msgs || !c.msgs.length) { c.msgs = buildMsgs(c); return; }
  if (c.msgs[0].text_es && c.msgs[0].text_en) return;
  var fresh = buildMsgs(c);
  c.msgs.forEach(function(m, i) {
    if (!m.text_es) m.text_es = fresh[i] ? fresh[i].text_es : m.text;
    if (!m.text_en) m.text_en = fresh[i] ? fresh[i].text_en : m.text;
    if (!m.label_es) m.label_es = fresh[i] ? fresh[i].label_es : m.label;
    if (!m.label_en) m.label_en = fresh[i] ? fresh[i].label_en : m.label;
    if (!m.activeLang) m.activeLang = c.lang || detectLang(c.name);
  });
}

// NOTIFICATIONS
function scheduleNotifs(client) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var first = client.name.split(' ')[0];
  var notifs = JSON.parse(localStorage.getItem('fu_notifs') || '[]');
  var schedule = [
    { day: 1, msg: 'Send SMS to ' + first + ' — Day 1 notice', clientId: client.id },
    { day: 2, msg: 'Call ' + first + ' — kit should have arrived', clientId: client.id },
    { day: 7, msg: 'Send SMS to ' + first + ' — 1 week check-in', clientId: client.id }
  ];
  schedule.forEach(function(s) {
    var d = addDays(client.saleDate, s.day);
    d.setHours(13, 0, 0, 0);
    notifs.push({ time: d.getTime(), msg: s.msg, clientId: s.clientId, day: s.day });
  });
  localStorage.setItem('fu_notifs', JSON.stringify(notifs));
}

function removeNotifs(clientId) {
  var notifs = JSON.parse(localStorage.getItem('fu_notifs') || '[]');
  localStorage.setItem('fu_notifs', JSON.stringify(notifs.filter(function(n) { return n.clientId !== clientId; })));
}

function checkNotifs() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  var now = Date.now();
  var notifs = JSON.parse(localStorage.getItem('fu_notifs') || '[]');
  var keep = [];
  notifs.forEach(function(n) {
    if (n.time <= now && n.time >= now - 3600000) {
      new Notification('Follow-Up · Spectrum', { body: n.msg, tag: n.clientId + '-' + n.day });
    } else if (n.time > now) { keep.push(n); }
  });
  localStorage.setItem('fu_notifs', JSON.stringify(keep));
}

// CSV IMPORT
document.getElementById('csv-input').addEventListener('change', function(e) { handleFile(e.target.files[0]); });
document.getElementById('drop-zone').addEventListener('dragover', function(e) { e.preventDefault(); });
document.getElementById('drop-zone').addEventListener('drop', function(e) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

function parseCSVLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') { inQ = !inQ; continue; }
    if (c === ',' && !inQ) { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function parseDate(str) {
  if (!str) return today();
  var d = new Date(str);
  return isNaN(d.getTime()) ? today() : d.toISOString().split('T')[0];
}

function handleFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var lines = e.target.result.split('\n').filter(function(l) { return l.trim(); });
    if (lines.length < 2) { showToast('CSV too short'); return; }

    var headers = parseCSVLine(lines[0]).map(function(h) { return h.trim().replace(/^["']|["']$/g, '').trim().toLowerCase(); });
    function col(name) { return headers.indexOf(name); }

    var iName   = col('name');
    var iPhone  = col('phone');
    var iEmail  = col('email');
    var iAddr   = col('address');
    var iDate   = col('sales date');
    var iNotes  = col('notes');
    var iID     = col('id');
    var iStatus    = col('status');
    var iPkg       = col('package');
    var iPIA       = col('pia');
    var iPkgClient = col('package (from client)');

    var added = 0, updated = 0, dupes = 0;

    function parseStatus(rawStatus, pkgClient) {
      var pkg = (pkgClient || '').trim();
      // Empty Package (From Client) = brand new sale, not yet processed = Pending
      if (!pkg) return 'Pending';
      var src = pkg + ' ' + (rawStatus || '').trim();
      if (/\(installed\)/i.test(src)) return 'Installed';
      if (/\(pending\)/i.test(src)) return 'Pending';
      if (/\(cancel/i.test(src) || /charge.back|disconnect|no.tpv|escalat/i.test(src)) return 'Cancelled';
      if (/installed|paid/i.test(src)) return 'Installed';
      if (/cancel|charge.back|disconnect|no.tpv|error|escalat/i.test(src)) return 'Cancelled';
      return 'Pending';
    }

    // Smart plan formatter
    function formatPlan(pkg, pia) {
      var internet = '';
      var cable = false;
      if (!pkg) return '';

      // Detect cable/TV
      if (/tv|cable|c10/i.test(pkg)) cable = true;

      // Detect internet type
      if (/ultra/i.test(pkg)) internet = 'Internet Ultra';
      else if (/gig|i10/i.test(pkg)) internet = 'Internet GIG';
      else if (/i10/i.test(pkg)) internet = 'Internet GIG';
      else internet = 'Internet';

      var result = cable ? internet + ' + Cable' : internet;

      // PIA
      if (pia) {
        var piaClean = pia.trim();
        if (/yes/i.test(piaClean)) {
          var valMatch = piaClean.match(/\$[\d,.]+/);
          result += ' · PIA: Yes' + (valMatch ? ' ' + valMatch[0] : '');
        } else if (/no/i.test(piaClean)) {
          result += ' · PIA: No';
        }
      }
      return result;
    }

    for (var i = 1; i < lines.length; i++) {
      var cols = parseCSVLine(lines[i]);
      var name = iName >= 0 ? (cols[iName] || '').trim() : '';
      if (!name) continue;

      var saleId = iID >= 0 ? (cols[iID] || '').trim() : '';

      // Dedup by saleId (primary) or name+date (fallback)
      var saleDate = parseDate(iDate >= 0 ? (cols[iDate] || '').trim() : '');
      var existIdx = -1;
      if (saleId) {
        existIdx = clients.findIndex(function(c) { return c.saleId === saleId; });
      }
      if (existIdx < 0) {
        existIdx = clients.findIndex(function(c) { return c.name === name && c.saleDate === saleDate; });
      }

      var rawStatus = iStatus >= 0 ? (cols[iStatus] || '') : '';
      var pkgClient = iPkgClient >= 0 ? (cols[iPkgClient] || '') : '';
      var status = parseStatus(rawStatus, pkgClient);

      var pkg = iPkg >= 0 ? (cols[iPkg] || '').trim().replace(/\s+/g,' ') : '';
      var pia = iPIA >= 0 ? (cols[iPIA] || '').trim() : '';
      var planFormatted = formatPlan(pkg, pia);

      if (existIdx >= 0) {
        clients[existIdx].status = status;
        if (planFormatted) clients[existIdx].plan = planFormatted;
        updated++;
        continue;
      }

      // Check for duplicate by name only (different date — different entry, allow)
      var nameDupe = clients.findIndex(function(c) { return c.name === name && c.saleDate === saleDate; });
      if (nameDupe >= 0) { dupes++; continue; }

      var rawNotes = iNotes >= 0 ? (cols[iNotes] || '').trim() : '';
      var numMatch = rawNotes.match(/^(#?\d+\w*|apt\.?\s*\w+|unit\s*\w+)/i);
      var correctAddr = numMatch ? numMatch[0].trim() : '';

      var client = {
        id: Date.now() + i,
        saleId: saleId,
        name: name,
        phone: iPhone >= 0 ? (cols[iPhone] || '').trim() : '',
        email: iEmail >= 0 ? (cols[iEmail] || '').trim() : '',
        address: iAddr >= 0 ? (cols[iAddr] || '').trim() : '',
        correctAddr: correctAddr,
        saleDate: saleDate,
        notes: rawNotes,
        plan: planFormatted,
        lang: detectLang(name),
        msgs: [],
        status: status
      };
      client.msgs = buildMsgs(client);
      clients.push(client);
      scheduleNotifs(client);
      added++;
    }

    save();
    renderList();
    updateStats();
    var msg = [];
    if (added > 0) msg.push(added + ' new');
    if (updated > 0) msg.push(updated + ' updated');
    if (dupes > 0) msg.push(dupes + ' duplicates skipped');
    showToast(msg.length ? msg.join(' · ') : 'Import done');
    goTab('clients');
  };
  reader.readAsText(file);
}

// CLIENT LIST
function renderList() {
  var el = document.getElementById('cl-list');
  var query = (document.getElementById('search-input').value || '').toLowerCase().trim();
  if (!clients.length) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">📱</div><p>No clients yet</p><p style="font-size:11px;margin-top:6px;">Import CSV from Ownerville</p></div>';
    return;
  }
  var sorted = clients.slice().sort(function(a, b) { return b.saleDate.localeCompare(a.saleDate); });
  var filtered = query ? sorted.filter(function(c) { return c.name.toLowerCase().indexOf(query) >= 0; }) : sorted;

  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-ico">🔍</div><p>No results for "' + query + '"</p></div>';
    return;
  }

  el.innerHTML = filtered.map(function(c, i) {
    var lang = c.msgs[0] ? c.msgs[0].activeLang : c.lang;
    var flag = lang === 'es' ? 'MX' : 'US';
    var next = c.msgs.find(function(m) { return !m.copied; });
    var sub = next ? flag + ' · ' + next.label + ' · ' + next.dateDisplay : flag + ' · All messages sent';
    var planShort = c.plan ? c.plan.replace(/\(.*?\)/g,'').trim().substring(0,30) : '';
    return '<div class="cl-item" onclick="openClient(' + c.id + ')">' +
      '<div class="cl-av" style="background:' + grad(i) + '">' + c.name[0].toUpperCase() + '</div>' +
      '<div class="cl-info">' +
        '<div class="cl-name">' + c.name + '</div>' +
        '<div class="cl-sub">' + sub + '</div>' +
        (planShort ? '<div class="cl-plan">' + planShort + '</div>' : '') +
      '</div>' +
      '<div style="color:var(--muted);font-size:18px;">›</div>' +
    '</div>';
  }).join('');
}

      (c.plan ? '<div class="p-plan">📦 ' + c.plan.replace('· PIA: Yes', '· <span style="color:var(--green)">PIA: Yes</span>').replace('· PIA: No', '· <span style="color:var(--muted)">PIA: No</span>') + '</div>' : '') +
      '<div style="display:flex;gap:6px;margin-top:10px;align-items:center;">' +

        '<button id="btn-en-' + id + '" onclick="switchLang(' + id + ',\'en\')" style="padding:5px 12px;border-radius:8px;border:1px solid ' + (activeLang==='en'?'var(--cyan)':'var(--border)') + ';background:' + (activeLang==='en'?'#06b6d415':'var(--s2)') + ';color:' + (activeLang==='en'?'var(--cyan)':'var(--muted)') + ';font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">🇺🇸 EN</button>' +
        '<span style="font-size:9px;color:var(--muted);background:var(--s3);padding:2px 6px;border-radius:99px;">' + detected + ' auto</span>' +
      '</div>' +
      '<div class="p-actions">' +
        '<button class="p-btn" style="background:#06b6d415;color:var(--cyan);border:1px solid #06b6d430;" onclick="resetMsgs(' + id + ')">🔄 Reset</button>' +
        (phoneFormatted ? '<a href="tel:' + phoneFormatted + '" class="p-btn" style="background:#8b5cf615;color:#a78bfa;border:1px solid #8b5cf630;text-decoration:none;display:flex;align-items:center;justify-content:center;">📞 Call</a>' : '') +

        '<div id="phone-d-' + id + '" class="info-val" style="cursor:pointer;" onclick="editPhone(' + id + ')">' + (c.phone || '—') + ' ✏️</div>' +
        '<input id="phone-i-' + id + '" type="tel" value="' + (c.phone || '') + '" style="display:none;width:100%;background:var(--s3);border:1px solid var(--cyan);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px;font-family:Inter,sans-serif;outline:none;margin-top:4px;" onblur="savePhone(' + id + ')" onkeydown="if(event.key===\'Enter\')savePhone(' + id + ')">' +

      (c.correctAddr ? '<div class="info-box full"><div class="info-label">🏠 Correct Address</div><div class="info-val" style="color:var(--cyan);font-weight:600;">' + c.correctAddr + '</div></div>' : '') +
      (c.notes ? '<div class="info-box full"><div class="info-label">📝 Notes</div><div class="info-val" style="color:var(--yellow);">' + c.notes + '</div></div>' : '') +
    '</div>' +

    '<div class="phone-wrap">' +
      '<div class="phone"><div class="ph-bar"></div>' +

          '<div class="ph-name">SPECTRUM (LEO)</div>' +
          '<div class="ph-bubble" id="pb-text">' + (c.msgs[0] ? c.msgs[0].text : '...') + '</div>' +
          '<div class="ph-ts" id="pb-ts">' + (c.msgs[0] ? c.msgs[0].timeDisplay : '') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="card-title">💬 Messages</div>' +

function renderTimeline(c) {
  var el = document.getElementById('tl-' + c.id);
  if (!el) return;
  el.innerHTML = c.msgs.map(function(m, i) {
    return '<div class="sms-item" id="sms-' + c.id + '-' + i + '">' +
      '<div class="sms-hdr" onclick="previewSMS(' + c.id + ',' + i + ')">' +
        '<div><div class="sms-lbl">' + m.label + '</div><div class="sms-date">' + m.timeDisplay + '</div></div>' +
        '<div style="display:flex;gap:6px;align-items:center;">' +
          '<button onclick="event.stopPropagation();copyMsg(' + c.id + ',' + i + ')" style="background:#10b98115;border:1px solid #10b98130;color:var(--green);border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">📋 Copy</button>' +
          '<button onclick="event.stopPropagation();toggleEdit(' + c.id + ',' + i + ')" style="background:#06b6d415;border:1px solid #06b6d430;color:var(--cyan);border-radius:6px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">✏️ Edit</button>' +
        '</div>' +
      '</div>' +
      '<div id="sv-' + c.id + '-' + i + '" class="sms-body">' + m.text + '</div>' +
      '<div id="se-' + c.id + '-' + i + '" style="display:none;margin-top:8px;">' +
        '<textarea id="sta-' + c.id + '-' + i + '" rows="4" oninput="updateCount(' + c.id + ',' + i + ')" style="width:100%;background:var(--s3);border:1px solid var(--cyan);color:var(--text);border-radius:10px;padding:10px;font-size:12px;font-family:Inter,sans-serif;outline:none;resize:none;line-height:1.6;">' + m.text + '</textarea>' +
        '<div style="text-align:right;font-size:10px;margin-top:3px;"><span id="sc-' + c.id + '-' + i + '" style="color:var(--muted)">' + m.text.length + '</span>/160</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px;">' +
          '<button onclick="saveEdit(' + c.id + ',' + i + ')" style="flex:1;background:#10b98120;border:1px solid #10b98140;color:var(--green);border-radius:8px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">✓ Save</button>' +
          '<button onclick="toggleEdit(' + c.id + ',' + i + ')" style="flex:1;background:var(--s2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Cancel</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function copyMsg(cId, idx) {
  var c = clients.find(function(x) { return x.id === cId; });
  var m = c.msgs[idx];
  var done = function() { showToast('📋 Copied! Paste in Messages'); };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(m.text).then(done).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = m.text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); done();
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = m.text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  }
}

function previewSMS(cId, idx) {
  var c = clients.find(function(x) { return x.id === cId; });
  var m = c.msgs[idx];
  var pb = document.getElementById('pb-text');
  var ts = document.getElementById('pb-ts');
  if (pb) pb.textContent = m.text;
  if (ts) ts.textContent = m.timeDisplay;
}

function toggleEdit(cId, idx) {
  var v = document.getElementById('sv-' + cId + '-' + idx);
  var e = document.getElementById('se-' + cId + '-' + idx);
  var editing = e.style.display !== 'none';
  v.style.display = editing ? 'block' : 'none';
  e.style.display = editing ? 'none' : 'block';
  if (!editing) document.getElementById('sta-' + cId + '-' + idx).focus();
}

function updateCount(cId, idx) {
  var ta = document.getElementById('sta-' + cId + '-' + idx);
  var n = document.getElementById('sc-' + cId + '-' + idx);
  if (!ta || !n) return;
  var len = ta.value.length;
  n.textContent = len;
  n.style.color = len > 160 ? 'var(--red)' : len > 140 ? 'var(--yellow)' : 'var(--muted)';
}

function saveEdit(cId, idx) {
  var c = clients.find(function(x) { return x.id === cId; });
  var t = document.getElementById('sta-' + cId + '-' + idx).value.trim();
  if (!t) return;
  var m = c.msgs[idx];
  m.text = t;
  if (m.activeLang === 'es') m.text_es = t; else m.text_en = t;
  save();
  document.getElementById('sv-' + cId + '-' + idx).textContent = t;
  toggleEdit(cId, idx);
  var pb = document.getElementById('pb-text');
  if (pb) pb.textContent = t;
  showToast('✅ Saved!');
}

function switchLang(id, lang) {
  var c = clients.find(function(x) { return x.id === id; });
  ensureBilingual(c);
  c.msgs.forEach(function(m) {
    m.activeLang = lang;
    m.text  = lang === 'es' ? m.text_es  : m.text_en;
    m.label = lang === 'es' ? m.label_es : m.label_en;
  });
  c.lang = lang;
  save();
  renderTimeline(c);
  var next = c.msgs[0];
  var pb = document.getElementById('pb-text');
  var ts = document.getElementById('pb-ts');
  if (pb && next) pb.textContent = next.text;
  if (ts && next) ts.textContent = next.timeDisplay;
  ['es', 'en'].forEach(function(l) {
    var btn = document.getElementById('btn-' + l + '-' + id);
    if (!btn) return;
    var active = l === lang;
    btn.style.borderColor = active ? 'var(--cyan)' : 'var(--border)';
    btn.style.background  = active ? '#06b6d415'   : 'var(--s2)';
    btn.style.color       = active ? 'var(--cyan)'  : 'var(--muted)';
  });
  showToast(lang === 'es' ? '🇲🇽 Español' : '🇺🇸 English');
}

function resetMsgs(id) {
  var c = clients.find(function(x) { return x.id === id; });
  c.msgs = buildMsgs(c);
  save();
  openClient(id);
  showToast('🔄 Messages reset!');
}

function completeRemove(id) {
  removeNotifs(id);
  clients = clients.filter(function(x) { return x.id !== id; });
  save();
  backToList();
  updateStats();
  showToast('Client removed!');
}

function editName(id) {
  document.getElementById('pname-d-' + id).style.display = 'none';
  var inp = document.getElementById('pname-i-' + id);
  inp.style.display = 'block'; inp.focus(); inp.select();
}

function saveName(id) {
  var inp = document.getElementById('pname-i-' + id);
  var n = inp.value.trim();
  if (!n) { inp.focus(); return; }
  var c = clients.find(function(x) { return x.id === id; });
  c.name = n; save();
  var av = document.getElementById('av-' + id);
  if (av) av.textContent = n[0].toUpperCase();
  inp.style.display = 'none';
  var d = document.getElementById('pname-d-' + id);
  d.textContent = n + ' ✏️'; d.style.display = 'block';
  renderList(); showToast('✅ Name updated!');
}

function editPhone(id) {
  document.getElementById('phone-d-' + id).style.display = 'none';
  var inp = document.getElementById('phone-i-' + id);
  inp.style.display = 'block'; inp.focus(); inp.select();
}

function savePhone(id) {
  var inp = document.getElementById('phone-i-' + id);
  var n = inp.value.trim();
  var c = clients.find(function(x) { return x.id === id; });
  c.phone = n; save();
  openClient(id);
  showToast('✅ Phone updated!');
}

function backToList() {
  document.getElementById('cl-list').style.display = 'block';
  document.getElementById('cl-detail').style.display = 'none';
  renderList();
}

function clearAll() {
  if (!confirm('Clear ALL clients?')) return;
  clients = []; save(); renderList(); updateStats(); showToast('Cleared!'); goTab('clients');
}

// STATS
// ── WEEKLY REPORT ─────────────────────────────────────────────
var weekOffset = 0;

function getWeekBounds(offset) {
  var now = new Date();
  var day = now.getDay(); // 0=Sun
  var sun = new Date(now);
  sun.setDate(now.getDate() - day + (offset * 7));
  sun.setHours(0,0,0,0);
  var sat = new Date(sun);
  sat.setDate(sun.getDate() + 6);
  sat.setHours(23,59,59,999);
  return { start: sun, end: sat };
}

function fmtShort(d) {
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function shiftWeek(dir) {
  weekOffset += dir;
  renderWeekReport();
}

function renderWeekReport() {
  var bounds = getWeekBounds(weekOffset);
  var label = fmtShort(bounds.start) + ' – ' + fmtShort(bounds.end) + (weekOffset === 0 ? ' (This week)' : weekOffset === -1 ? ' (Last week)' : '');
  document.getElementById('week-label').textContent = label;

  var weekClients = clients.filter(function(c) {
    var d = new Date(c.saleDate + 'T12:00:00');
    return d >= bounds.start && d <= bounds.end;
  });

  var total = weekClients.length;
  var installed = weekClients.filter(function(c) { return c.status === 'Installed'; }).length;
  var cancelled = weekClients.filter(function(c) { return c.status === 'Cancelled'; }).length;
  var pending   = weekClients.filter(function(c) { return c.status === 'Pending'; }).length;

  var wr = document.getElementById('week-report');
  if (!total) {
    wr.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">No sales this week</div>';
    return;
  }

  // Build day-by-day breakdown
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var byDay = [0,0,0,0,0,0,0];
  weekClients.forEach(function(c) {
    var d = new Date(c.saleDate + 'T12:00:00');
    byDay[d.getDay()]++;
  });

  var dayRow = days.map(function(d, i) {
    var n = byDay[i];
    return '<div style="text-align:center;flex:1;">' +
      '<div style="font-size:9px;color:var(--muted);font-weight:600;">' + d + '</div>' +
      '<div style="font-size:16px;font-weight:800;color:' + (n > 0 ? 'var(--cyan)' : 'var(--muted)') + ';margin-top:2px;">' + (n || '·') + '</div>' +
    '</div>';
  }).join('');

  // Client list for the week
  var clientRows = weekClients.sort(function(a,b){ return a.saleDate.localeCompare(b.saleDate); }).map(function(c) {
    var color = c.status === 'Installed' ? 'var(--green)' : c.status === 'Cancelled' ? 'var(--red)' : 'var(--yellow)';
    var planShort = c.plan ? c.plan.split('·')[0].trim() : '';
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">' +
      '<div>' +
        '<div style="font-size:12px;font-weight:600;">' + c.name + '</div>' +
        (planShort ? '<div style="font-size:10px;color:var(--muted);margin-top:1px;">' + planShort + '</div>' : '') +
      '</div>' +
      '<div style="font-size:10px;font-weight:700;color:' + color + ';background:' + color.replace(')',',0.1)').replace('var(','rgba(').replace('--green','16,185,129').replace('--red','239,68,68').replace('--yellow','245,158,11') + ';padding:3px 8px;border-radius:99px;">' + c.status + '</div>' +
    '</div>';
  }).join('');

  wr.innerHTML =
    '<div style="display:flex;margin-bottom:14px;">' + dayRow + '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;">' +
      '<div style="background:#10b98115;border:1px solid #10b98130;border-radius:10px;padding:10px;text-align:center;">' +
        '<div style="font-size:22px;font-weight:800;color:var(--green);">' + installed + '</div>' +
        '<div style="font-size:9px;color:var(--green);font-weight:700;text-transform:uppercase;">Installed</div>' +
      '</div>' +
      '<div style="background:#f59e0b15;border:1px solid #f59e0b30;border-radius:10px;padding:10px;text-align:center;">' +
        '<div style="font-size:22px;font-weight:800;color:var(--yellow);">' + pending + '</div>' +
        '<div style="font-size:9px;color:var(--yellow);font-weight:700;text-transform:uppercase;">Pending</div>' +
      '</div>' +
      '<div style="background:#ef444415;border:1px solid #ef444430;border-radius:10px;padding:10px;text-align:center;">' +
        '<div style="font-size:22px;font-weight:800;color:var(--red);">' + cancelled + '</div>' +
        '<div style="font-size:9px;color:var(--red);font-weight:700;text-transform:uppercase;">Cancelled</div>' +
      '</div>' +
    '</div>' +
    '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:8px;">' + total + ' Sales this week</div>' +
    clientRows;
}

function updateStats() {
  var total = clients.length;
  var installed = 0, pending = 0, cancelled = 0;

  clients.forEach(function(c) {
    if (c.status === 'Installed') installed++;
    else if (c.status === 'Cancelled') cancelled++;
    else pending++;
  });

  var pct = function(n) { return total ? Math.round((n/total)*100) + '%' : '0%'; };

  document.getElementById('st-total').textContent = total;
  document.getElementById('st-installed').textContent = installed;
  document.getElementById('st-installed-pct').textContent = pct(installed);
  document.getElementById('st-pending').textContent = pending;
  document.getElementById('st-pending-pct').textContent = pct(pending);
  document.getElementById('st-cancelled').textContent = cancelled;
  document.getElementById('st-cancelled-pct').textContent = pct(cancelled);

  renderWeekReport();
}

// TABS
function goTab(tab) {
  ['clients', 'import', 'stats'].forEach(function(t) {
    document.getElementById('v-' + t).classList.toggle('on', t === tab);
    document.getElementById('nb-' + t).classList.toggle('on', t === tab);
  });
  if (tab === 'clients') backToList();
  if (tab === 'stats') { weekOffset = 0; updateStats(); }
}

// TOAST
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2600);
}

// INIT
clients.forEach(function(c) {
  var detected = detectLang(c.name);
  if (c.lang !== detected) {
    c.lang = detected;
    if (c.msgs && c.msgs.length) {
      c.msgs.forEach(function(m) {
        m.activeLang = detected;
        m.text  = detected === 'es' ? (m.text_es || m.text) : (m.text_en || m.text);
        m.label = detected === 'es' ? (m.label_es || m.label) : (m.label_en || m.label);
      });
    }
  }
  ensureBilingual(c);
});
save();
renderList();
updateStats();

if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}
checkNotifs();
setInterval(checkNotifs, 30 * 60 * 1000);
</script>
</body>
</html>
